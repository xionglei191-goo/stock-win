[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tdx-research-platform"
version = "0.1.0"
description = "Local multi-strategy research platform backed by TongdaXin data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=18",
  "pydantic>=2.10",
  "openai>=2,<3",
  "psutil>=6",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = ["httpx>=0.28"]

[tool.setuptools.packages.find]
include = ["research_platform*", "strategy_v1*"]
